<!DOCTYPE html!>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <title>inscriçao no evento do tech 2026</title>
    </head>
    <body>
        <h2>formulario de inscriçao tech</h2>
        <form action="https://postman-echo.com/post" method="post">
            <div>
                <label for="nome_id">nome completo:</label>
                <input id="nome_id" name="nome" type="text" placeholder="digite seu nome completo" required>
            </div>
            <div>
                <label for="email">email:</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div>
                <label for="telefone_id">telefone:</label>
                <input id="telefone_id" name="telefone" type="tel" pattern="[0-9]{2} [0-9]{5} [0-9]{4}" placeholder="11 99999-9999">
            </div>
            <div>
                <label for="senha_id">criar uma senha:</label>
                <input id="senha_id" name="senha" type="password" required>
            </div>
            <div>
                <label for="data_nasc_id">data de nascimento:</label>
                <input id="data_nasc_id" name="data_nasc" type="date">
            </div>
            <div>
                <label for="cargo_id">area de atuaçao:</label>
                <select id="cargo_id" name="cargo">
                    <option value="desenvolvedor">desenvolvedor(a)</option>
                    <option value="design">designer</option>
                    <option value="dados">cientista de dados</option>
                    <option value="outros">outros</option>
            </div>
            <div>
                <label for="empresa_id">empresa:</label>
                <input id="empresa_id" name="empresa" type="text" placeholder="opcional">
            </div>
            <fieldset>
                <div>
                <label for="bio_id">fale um pouco sobre voce:</label>
                <textarea id="bio_id" name="biografia" rows="4"></textarea>
            </div>
            </fieldset>
            <div>
                <button type="reset">limpar dados</button>
                <button type="submit">enviar candidatura</button>
            </div>

        </form>
    </body>
</html>

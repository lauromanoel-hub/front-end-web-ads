<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>recrutamento online</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <header>
            <h1>recrutamento online</h1>
        </header>
        <Main>
            <section>
                <h2>cadastre seu curriculo</h2>  
                <form action="#" method="get">
                     <p>preencha o formulario para se candidatar à vaga</p>
                     <fieldset>
                        <legend>dados pessoais</legend>
                        <div>
                            <label for="nome_id">nome completo:</label>
                            <input id="nome_id" name="nome" type="text">
                        </div>
                        <div>
                            <label for="telefone_id">telefone:</label>
                            <input id="telefone_id" name="telefone" type="tel">
                        </div>
                        <div>
                            <label for="email_id">email:</label>
                            <input id="email_id" name="email" tyor="email">
                        </div>
                        <div>
                            <label for="data_nasc_id">data de nascimento:</label>
                            <input id="data_nasc_id" name="data_nasc" type="date">
                        </div>
                     </fieldset>
                     <fieldset>
                        <legend>endereço</legend>
                        <div>
                            <label for="logradouro_id">logradouro</label>
                            <input id="logradouro_id" name="logradouro" type="text">
                        </div>
                        <div>
                            <label for="cidade_id"> cidade_UF:</label>
                            <input id="cidade_id" name="cidade" type="text">
                        </div>
                        <div>
                            <label for="numero_id">neumero:</label>
                            <input id="numero_id" name="numero" type="number">
                        </div>
                        
                     </fieldset>
                     <fieldset>
                        <legend>resumo</legend>
                        <div>
                            <label for="resumo_id">fale sobre voce</label>
                            <textarea id="resumo_id"
                                       name="resumo" 
                                       rows="10" 
                                       cols="50"></textarea>
                        </div>
                     </fieldset>

                     <fieldset>
                        <legend>nivel pretendido</legend>
                        <div>
                            <input id="estagiario_id"
                                     name="nivel"
                                     type="radio"
                                     value="estagiario">
                        </div>
                        <div>
                            <input id="junior_id"
                                     name="nivel"
                                     type="radio"
                                     value="junior">
                        </div>
                     </fieldset>
                    
                     <fieldset>
                        <legend>tecnologia</legend>
                        <div>
                            <input id="tec_html_id"
                                     name="tecnologia"
                                     type="checkbox"
                                     value="html">
                            <label for="tec_html_id">HTML</label>
                        </div>
                        <div>
                            <input id="tec_css_id"
                                     name="tecnologia"
                                     type="checkbox"
                                     valuE="css">
                            <label for="tec_css_id"> CSS</label>
                        </div>
                        <div>
                            <input id="tec_js_id"
                                     name="tecnologia"
                                     type="checkbox"
                                     value="tec_js_id">
                            <label for="tec_js_id">javascript</label>
                        </div>
                     </fieldset>
                     <fieldset>
                        <legend>grau de instruçao</legend>
                        <div>
                            <label for="escolariedade_id">escolariedade:</label>
                            <select id="escolariedade_id" name="escolariedade">
                               <option value="medio">ensino medio</option>
                               <option value="graduaçao">graduaçao</option>
                               <option value="pos">pos-graduaçao</option>
                            </select>
                        </div>
                     </fieldset>
                     <div>
                        <button type="reset">limpar dados</button>
                        <button type="submit">enviar candidatura</button>
                     </div>
                </form>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   
            </section>
        </Main>
        <footer>
            <p>todos os direitos reservados</p>
        </footer>
    </body>
</html>
